<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网盘管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182338;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:36px auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px}a{color:#2563eb}button,input,textarea{font:inherit;border:1px solid #cdd5e1;border-radius:7px;padding:9px 12px}button{cursor:pointer;background:white;color:#18335b}button.primary{background:#2563eb;color:white;border-color:#2563eb}button:disabled{opacity:.5;cursor:wait}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:24px;margin-top:20px}label{display:block;margin:14px 0}label input{width:100%;margin-top:6px}#login{max-width:430px;margin:70px auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:13px 9px;border-bottom:1px solid #edf0f5}td.actions{white-space:nowrap}.scroll{overflow:auto}#status{min-height:24px;color:#52627a;white-space:pre-wrap}dialog{width:min(760px,94vw);border:1px solid #cdd5e1;border-radius:14px;padding:24px}dialog::backdrop{background:#17243a80}textarea{width:100%;height:350px;resize:vertical;font-family:Consolas,monospace;margin:16px 0}.danger{color:#b42318}small{color:#6b778b}[hidden]{display:none!important}
</style>
<main><header><h1>网盘管理后台</h1><nav><a href="/admin">账号与站点设置</a> · <a href="/home">返回网盘</a></nav></header>
<form id="login" class="card"><h2>管理员登录</h2><label>邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form>
<section id="panel" class="card" hidden><div class="toolbar"><strong>全空间文件</strong><input id="search" placeholder="按文件名筛选" aria-label="按文件名筛选"><button id="refresh">刷新</button><button id="logout">退出管理</button></div><div class="scroll"><table><thead><tr><th>文件名</th><th>所有者</th><th>大小</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></div><div class="toolbar" style="margin-top:16px"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section>
<p id="status" role="status" aria-live="polite"></p>
<dialog id="editor"><form method="dialog"><h2 id="editName">编辑文件</h2><small>文本文件内容编辑，最大 2 MiB。</small><textarea id="content" aria-label="文件内容"></textarea><div class="toolbar"><button type="button" id="save" class="primary">保存</button><button>取消</button></div></form></dialog>
</main>
<script>
'use strict';
let token='',page=1,total=0,selected=null;
const el=id=>document.getElementById(id),status=(text,error=false)=>{el('status').textContent=text;el('status').className=error?'danger':'';};
async function api(method,path,data,raw=false){
 const headers={'Content-Type':raw?'text/plain;charset=utf-8':'application/json'};if(token)headers.Authorization='Bearer '+token;
 const response=await fetch('/api/v4'+path,{method,headers,body:data===undefined?undefined:raw?data:JSON.stringify(data)});
 if(!response.ok)throw Error('请求失败：HTTP '+response.status);
 const result=await response.json();if(result.code!==0)throw Error(result.msg||'操作失败（'+result.code+'）');return result.data;
}
async function load(){
 const conditions={};if(el('search').value.trim())conditions.file_name=el('search').value.trim();
 const result=await api('POST','/admin/file',{page,page_size:25,conditions,order_by:'id',order_direction:'desc'});
 total=result.pagination.total_items??0;el('files').replaceChildren();
 for(const file of result.files){
  const row=document.createElement('tr');
  for(const text of [file.name,file.edges?.owner?.email||file.edges?.owner?.nick||'用户 '+file.owner_id,file.type===1?'文件夹':(file.size/1024).toFixed(1)+' KB']){const cell=document.createElement('td');cell.textContent=text;row.append(cell);}
  const actions=document.createElement('td');actions.className='actions';
  const add=(name,fn)=>{const b=document.createElement('button');b.textContent=name;b.onclick=async()=>{b.disabled=true;try{await fn();}catch(e){status(e.message,true);}finally{b.disabled=false;}};actions.append(b,document.createTextNode(' '));};
  if((file.type??0)===0){add('编辑内容',()=>edit(file));add('下载',async()=>{const url=await api('GET','/admin/file/url/'+file.id);location.assign(url);});}
  if(file.name&&file.name!=='/'){
   add('改名',async()=>{const name=prompt('新文件名',file.name);if(!name||name===file.name)return;if(/[\\/]/.test(name))throw Error('文件名不能包含路径分隔符');const full=await api('GET','/admin/file/'+file.id);await api('PUT','/admin/file/'+file.id,{file:{...full,name}});await load();status('文件名已更新');});
   add('删除',async()=>{if(!confirm('永久删除“'+file.name+'”？此操作无法撤销。'))return;await api('POST','/admin/file/batch/delete',{ids:[file.id]});await load();status('文件已删除');});
  }
  row.append(actions);el('files').append(row);
 }
 if(!result.files.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=4;cell.textContent='没有文件';row.append(cell);el('files').append(row);}
 el('page').textContent='第 '+page+' 页';el('prev').disabled=page<=1;el('next').disabled=page*25>=total;
}
async function edit(file){
 if(file.size>2*1024*1024)throw Error('仅支持编辑 2 MiB 以内的文本文件，请下载后修改再上传。');
 if(!/\.(txt|md|json|csv|html?|css|js|ts|xml|ya?ml|ini|conf|log|sql|py|java|c|cpp|h|sh|ps1)$/i.test(file.name))throw Error('此文件不适合在线文本编辑，请使用下载功能。');
 const full=await api('GET','/admin/file/'+file.id);
 if(!full.content_version)throw Error('服务器尚未安装管理员编辑扩展');
 const url=await api('GET','/admin/file/url/'+file.id),response=await fetch(url);if(!response.ok)throw Error('读取文件失败');
 const bytes=new Uint8Array(await response.arrayBuffer());let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch{throw Error('此文件不是 UTF-8 文本，请下载后编辑。');}
 selected={...file,version:full.content_version};el('editName').textContent='编辑：'+file.name;el('content').value=text;el('editor').showModal();
}
el('login').onsubmit=async e=>{e.preventDefault();const button=el('login').querySelector('button');button.disabled=true;try{const form=new FormData(el('login'));const result=await api('POST','/session/token',{email:form.get('email'),password:form.get('password')});token=result.token.access_token;await api('GET','/admin/group/1');el('login').reset();el('login').hidden=true;el('panel').hidden=false;await load();status('已登录管理员账号，可管理所有用户文件。');}catch(e){token='';status('登录失败或没有管理员权限：'+e.message,true);}finally{button.disabled=false;}};
el('save').onclick=async()=>{if(!selected)return;el('save').disabled=true;try{if(new TextEncoder().encode(el('content').value).length>2*1024*1024)throw Error('内容不能超过 2 MiB');await api('PUT','/admin/file/'+selected.id+'/content?previous='+encodeURIComponent(selected.version),el('content').value,true);el('editor').close();await load();status('文件内容已保存');}catch(e){status('保存失败：'+e.message+'。如文件已被修改，请重新打开后编辑。',true);}finally{el('save').disabled=false;}};
el('refresh').onclick=()=>load().catch(e=>status(e.message,true));el('search').onchange=()=>{page=1;el('refresh').click();};el('prev').onclick=()=>{page--;el('refresh').click();};el('next').onclick=()=>{page++;el('refresh').click();};
el('logout').onclick=()=>{token='';selected=null;el('panel').hidden=true;el('login').hidden=false;el('files').replaceChildren();status('已退出管理');};
</script></html>
